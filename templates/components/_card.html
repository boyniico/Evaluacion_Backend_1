{% load static %}

<div class="col">
    <div class="card h-100 border-0 shadow-sm custom-color-bg">
        <img src="{% static item.image %}" class="card-img-top" style="height: 380px; object-fit: cover;" alt="{{ item.title }}">

        <div class="card-body d-flex flex-column">
            <h5 class="card-title fw-bold">{{ item.title }}</h5>
            <p class="card-text text-muted mb-1">{{ item.creator }}</p>
            <div>
                <span class="badge bg-secondary mb-2">{{ item.genre }}</span>
            </div>
            <div>
                {% if item.stock > 0 %}
                <span class="badge bg-success mb-2">Stock disponible</span>
                {% else %}
                <span class="badge bg-danger mb-2">Agotado</span>
                {% endif %}
            </div>

            <a href="{% url detail_url item.id %}" class="btn btn-sm btn-outline-dark mt-auto fw-bold">
                Ver Detalles
            </a>
        </div>

        <div class="card-footer bg-transparent border-0">
            <small class="text-muted">Año: {{ item.year }}</small>
        </div>
    </div>
</div>
